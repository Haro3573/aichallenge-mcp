services:
  aichallenge-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Keep the application private to the host; terminate public TLS in a
      # managed ingress or reverse proxy that forwards to this port.
      - "127.0.0.1:${MCP_EXTERNAL_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
